iorit\xE4t #1",color:Ee,subtitle:"Volle Streckung ist der wichtigste Pr\xE4-OP-Faktor gegen Vernarbung.",items:[{name:"Streckung: Heel Prop ODER Prone Hang",dose:"3\u20135 Min, 2\xD7/Tag",cue:"Zwei Varianten, eine reicht. Heel Prop (R\xFCckenlage): nur die Ferse liegt erh\xF6ht auf einer Rolle/einem Handtuch, Unterschenkel und Knie schweben frei, die Kniekehle sinkt durch die Schwerkraft Richtung Boden. Prone Hang (Bauchlage): Oberschenkel liegt bis zum Knie auf der Bett-/Tischkante, der Unterschenkel h\xE4ngt frei nach unten. Beide: Schwerkraft zieht das Knie gerade \u2013 NICHT wippen. Optional 1\u20132 kg auf den Oberschenkel legen."}]},{id:"quad",title:"2 \xB7 Quadrizeps aktiv halten",color:Pe,subtitle:"Gegen die reflektorische Quad-Abschaltung \u2013 spart dir Wochen in der Reha.",items:[{name:"Quad Sets (isometrisch)",dose:"5\xD7 10 Sek \xB7 mehrmals t\xE4glich",cue:"Isometrisch = anspannen ohne Bewegung im Gelenk. Bein komplett gestreckt, Kniekehle in die Unterlage dr\xFCcken, Oberschenkel maximal anspannen \u2013 die Kniescheibe zieht nach oben. VMO = der innere, tropfenf\xF6rmige Muskel direkt oberhalb der Kniescheibe (innen); er stabilisiert die Kniescheibe und schaltet nach Verletzung/OP als Erstes ab. Trick: zwei Finger innen kurz oberhalb der Kniescheibe auflegen und sp\xFCren, wie der Muskel fest wird. Fu\xDFspitze leicht nach au\xDFen drehen betont ihn. Knie bleibt gerade, kein Schmerz. 3\u20135 Sek Pause zwischen den Wiederholungen."},{name:"Straight-Leg-Raise",dose:"3\xD7 10\u201315",cue:"Im LIEGEN auf dem R\xFCcken \u2013 betrifft das linke (verletzte) Bein. Rechtes Bein angewinkelt aufstellen (Fu\xDF am Boden), linkes Bein ganz gestreckt. Zuerst Quad anspannen, DANN das gestreckte Bein langsam ~30\u201345 cm heben, 2 Sek halten, langsam ab. Das Knie bleibt die ganze Zeit gerade \u2013 knickt es beim Heben ein, bist du zu hoch gegangen. Nicht h\xF6her als n\xF6tig: die Arbeit passiert unten, h\xF6her \xFCbernehmen nur die H\xFCftbeuger."},{name:"Terminal Knee Extension am Band",dose:"3\xD7 15  (Physio-Freigabe)",cue:"Trainiert die letzten Grade der Streckung (ca. 0\u201330\xB0, der VMO-Bereich). Elastikband auf Knieh\xF6he an etwas Festem anschlingen und so durchsteigen, dass das Band hinten in der Kniekehle des linken Beins liegt und dich nach vorne zieht. Fu\xDF flach am Boden, Knie leicht gebeugt (~20\u201330\xB0). Dann das Knie aktiv voll durchdr\xFCcken (Lockout) gegen den Bandzug, den Quad einrasten, ~2 Sek halten, kontrolliert in die leichte Beugung zur\xFCck. Bewegung kommt aus dem Knie \u2013 nicht das Becken nach hinten schieben. Erst nach Physio-Freigabe (belastet im Stehen)."}]},{id:"mob",title:"3 \xB7 Beweglichkeit \u2014 sanft",color:"#cf9a4e",subtitle:"Kniescheibe locker halten, Beugung vorsichtig \u2013 ohne die Meniskusnaht zu reizen.",items:[{name:"Patella-Mobilisation",dose:"30 Sek/Richtung",cue:"Bein komplett entspannt und gestreckt (Quad locker \u2013 bei Anspannung klemmt die Kniescheibe fest). Kniescheibe mit den Fingern fassen und sanft schieben: hoch/runter, dann nach innen/au\xDFen, je ~30 Sek. Sollte sich weich verschieben lassen. H\xE4lt die Kniescheibe beweglich und beugt Verklebungen (u. a. mit dem Hoffa-Fettk\xF6rper) vor. Ohne Schmerz."},{name:"Heel Slides",dose:"2\xD7 10  (Physio-Freigabe)",cue:"Im Liegen, linkes Bein gestreckt. Ferse langsam auf der Unterlage Richtung Ges\xE4\xDF ziehen, bis ein leichter Dehnreiz kommt oder ~90\xB0 erreicht sind, kurz halten, langsam zur\xFCck. Gewinnt sanft Beugung zur\xFCck. NICHT in Schmerz oder Widerstand forcieren \u2013 die Meniskusnaht mag keine erzwungene tiefe Beugung. Nur nach Physio-Freigabe, bei Erguss zur\xFCckhaltend."}]},{id:"swell",title:"4 \xB7 Erguss-Management",color:Ee,subtitle:"Schwellung runter = besseres OP-Ergebnis.",items:[{name:"Sprunggelenk-Pumpen",dose:"2\xD7 30 kr\xE4ftig",cue:"Im Liegen, Bein m\xF6glichst hochgelagert. Fu\xDFspitze kr\xE4ftig und z\xFCgig zum Schienbein ziehen und wieder wegstrecken (wie Gaspedal), 2\xD730. Die Waden-Muskelpumpe schiebt Erguss aus dem Knie ab. Kostet nichts \u2013 gern mehrmals t\xE4glich, besonders nach langem Sitzen."},{name:"Hochlagern + K\xFChlen",dose:"10\u201315 Min \xB7 v.a. abends",cue:"Bein \xFCber Herzh\xF6he lagern (z. B. auf Kissen) \u2013 die H\xF6he l\xE4sst die Schwellung abflie\xDFen. K\xFChlpack 15 Min mit Tuch dazwischen (nicht direkt auf die Haut), besonders abends und nach Belastung. Reduziert Erguss und Reiz."}]}],timing:[{Icon:Ht,label:"Morgens",text:"Streckung + Quad Sets + SLR + Patella-Mobi. Weckt das Knie und setzt die volle Streckung f\xFCr den Tag."},{Icon:Ze,label:"Tags\xFCber",text:"Quad-Snacks: 3\u20134\xD7 am Tag je 5\xD710 Sek Quad Sets \u2013 z.B. am Schreibtisch. H\xE4lt den Quad wach."},{Icon:Rt,label:"Abends",text:"Volle Runde inkl. (freigegebener) Heel Slides + langes Hochlagern & K\xFChlen. Nimmt die Tagesschwellung raus."}],barometer:"Barometer: Jeden Morgen Streckung und Kniedicke checken. Mehr Schwellung oder weniger Streckung als am Vortag \u2192 Belastung am Knie zur\xFCckfahren, Basis hochfahren. Konstanz schl\xE4gt H\xE4rte."},qm={red:["Tiefe / belastete Kniebeugung \xFCber ~90\xB0 links","Drehen, Pivotieren, Verwringen unter Last & Stopp-/Cut-Bewegungen (gef\xE4hrdet die Meniskusnaht)","Valgus-Stress (linkes Knie f\xE4llt nach innen \u2013 Innenband)","Spr\xFCnge, Plyos, Impact, Lateral Bounds, Power Cleans mit Beinantrieb","Kniest\xE4nde, BJJ/Judo, alles mit vollem ROM oder Last in Endgraden","Beugung aggressiv \u201Ereinzwingen\u201C"],green:["Volle Streckung t\xE4glich wiederherstellen & halten","Quadrizeps aktiv halten (isometrisch, TKE, SLR, ggf. BFR)","Oberk\xF6rper, Rumpf & rechtes Bein voll belasten","Beugung sanft im schmerz-/schwellungsfreien Bereich (Ziel ~90\xB0)"],meniscus:"Meniskus-Merker f\xFCrs Arztgespr\xE4ch: Der Riss-Typ (vertikal, Hinterhorn, meniskokapsul\xE4r) ist oft n\xE4hbar statt Teilentfernung \u2013 f\xFCr dich als Grappler langfristig Gold wert. Frag konkret: Naht geplant? Was sch\xFCtzt die Naht-Chance bis zur OP?"},Nm={redTitle:"Tabu in Phase A (Woche 2\u20136)",red:["Offene Kette gegen Widerstand (Kniestrecken mit Gewicht), v. a. 0\u201345\xB0 \u2013 zieht direkt am Graft","Pivotieren/Drehen auf dem belasteten linken Fu\xDF, Stopp- und Cut-Bewegungen","Valgus-Stress (Knie f\xE4llt nach innen) \u2013 das Innenband heilt konservativ mit","Spr\xFCnge, Impact, Laufen","Tiefe belastete Kniebeugung (Knorpel Grad II + Graft)","BJJ/Judo, Kniest\xE4nde, Rollen \u2013 bis zur \xE4rztlichen Freigabe","Beugung \xFCber die Schienen-Freigabe hinaus erzwingen"],green:["Volle Streckung (0\xB0) \u2013 Priorit\xE4t #1, ein Streckdefizit ist die Hauptkomplikation","Quadrizeps ansteuern \u2013 nach Quadrizepssehnen-Graft die zentrale Baustelle","Aktive Beugung im freigegebenen Rahmen (aktuell 60\xB0, laut Schema Wo. 3\u20134 dann 90\xB0)","Schwellung/Erguss runter halten","Oberk\xF6rper, Rumpf & rechtes Bein voll trainieren"],meniscus:"Die zwei Uhren: Deine Funktion (Streckung, Quad, Gangbild) darf schneller sein als das Standardschema \u2013 die l\xE4uft nach Kriterien. Dein Transplantat wird umgebaut und ist in Woche 6\u201312 am schw\xE4chsten; das l\xE4sst sich durch Fitness NICHT beschleunigen. Alles was den Graft belastet (Pivot, Spr\xFCnge, Laufen, Grappling) bleibt am Zeitplan."},Wm={intro:"Post-OP-Fundament. 2\u20133\xD7 t\xE4glich, je 8\u201312 Min. Dieser Teil ist wichtiger als die vier Trainingseinheiten zusammen \u2013 er entscheidet \xFCber Streckung, Quad-Ansteuerung und Schwellung. Nicht \xFCberspringen.",blocks:[{id:"r-ext",title:"1 \xB7 Streckung (Extension) \u2014 Priorit\xE4t #1",color:Ee,subtitle:"Ein Streckdefizit ist die Komplikation, die laut Schema zur Wiedervorstellung f\xFChrt.",items:[{name:"Heel Prop ODER Prone Hang",dose:"3\u20135 Min \xB7 2\u20133\xD7/Tag",cue:"Zwei Varianten, eine reicht. Heel Prop (R\xFCckenlage): nur die Ferse liegt erh\xF6ht, Unterschenkel und Knie schweben frei, die Kniekehle sinkt Richtung Boden. Prone Hang (Bauchlage): Oberschenkel liegt bis zum Knie auf der Bett-/Tischkante, Unterschenkel h\xE4ngt frei. Beide: Schwerkraft arbeiten lassen, NICHT wippen. Ziel: linkes Knie so flach wie das rechte. Nicht verhandelbar."}]},{id:"r-quad",title:"2 \xB7 Quadrizeps ansteuern",color:Pe,subtitle:"Nach Quadrizepssehnen-Graft die zentrale Baustelle \u2013 der Quad schaltet nach OP als Erstes ab.",items:[{name:"Quad Sets (isometrisch)",dose:"5\xD7 10 Sek \xB7 mehrmals t\xE4glich",cue:"Bein gestreckt, Kniekehle in die Unterlage dr\xFCcken, Oberschenkel maximal anspannen \u2013 die Kniescheibe zieht nach oben. Zwei Finger innen oberhalb der Kniescheibe auflegen (VMO) und sp\xFCren, wie er fest wird. Ein Ziehen vorn an der Entnahmestelle der Quadrizepssehne ist normal \u2013 stechender Schmerz nicht."},{name:"Straight-Leg-Raise",dose:"3\xD7 10\u201315",cue:"R\xFCckenlage, rechtes Bein angewinkelt aufstellen, linkes ganz gestreckt. Erst Quad anspannen, DANN das gestreckte Bein ~30\u201345 cm heben, 2 Sek halten, langsam ab. WICHTIG: Sackt das Knie beim Heben durch (Extension Lag), erst mehr Quad Sets machen \u2013 dann wieder SLR. Der Extension Lag ist dein Fortschritts-Marker."}]},{id:"r-mob",title:"3 \xB7 Beweglichkeit \u2014 im freigegebenen Rahmen",color:"#cf9a4e",subtitle:"Kniescheibe locker halten, Beugung nur bis zur Schienen-Freigabe.",items:[{name:"Patella-Mobilisation",dose:"30 Sek/Richtung",cue:"Post-OP besonders wichtig gegen Vernarbung und Verklebung. Bein v\xF6llig entspannt und gestreckt (bei Anspannung klemmt die Kniescheibe fest). Kniescheibe mit den Fingern fassen und sanft hoch/runter, dann innen/au\xDFen schieben. Ohne Schmerz."},{name:"Aktive Beugung (Heel Slides)",dose:"2\xD7 10 \xB7 aktuell bis 60\xB0",cue:"Deine \xC4rztin hat die Schiene auf 60\xB0 gestellt und aktives Bewegen freigegeben \u2013 genau in diesem Rahmen arbeiten. Ferse auf der Unterlage Richtung Ges\xE4\xDF ziehen, kurz halten, zur\xFCck. Laut Schema ab Woche 3\u20134 bis 90\xB0. Nicht \xFCber die Freigabe hinaus forcieren."}]},{id:"r-swell",title:"4 \xB7 Erguss & Thromboseschutz",color:Ee,subtitle:"Schwellung runter = bessere Quad-Ansteuerung und weniger Vernarbung.",items:[{name:"Sprunggelenk-Pumpen",dose:"2\xD7 30 kr\xE4ftig \xB7 mehrmals t\xE4glich",cue:"Bein hochgelagert, Fu\xDFspitze kr\xE4ftig zum Schienbein ziehen und wegstrecken (wie Gaspedal). Die Waden-Muskelpumpe schiebt Erguss ab und sch\xFCtzt zus\xE4tzlich vor Thrombose. Besonders nach langem Sitzen."},{name:"Hochlagern + K\xFChlen",dose:"10\u201315 Min \xB7 v. a. abends",cue:"Bein \xFCber Herzh\xF6he lagern. K\xFChlpack 15 Min mit Tuch dazwischen, nie direkt auf die Haut \u2013 und nicht auf die frische Wunde."}]}],timing:[{Icon:Ht,label:"Morgens",text:"Streckung + Quad Sets + SLR + Patella-Mobi. Setzt die volle Streckung f\xFCr den Tag."},{Icon:Ze,label:"Tags\xFCber",text:"Quad-Snacks: 3\u20134\xD7 je 5\xD710 Sek Quad Sets. Dazu Sprunggelenk-Pumpen nach langem Sitzen."},{Icon:Rt,label:"Abends",text:"Volle Runde inkl. Heel Slides bis zur Freigabe + langes Hochlagern & K\xFChlen."}],barometer:"Barometer: Jeden Morgen Streckung und Kniedicke pr\xFCfen. Mehr Schwellung oder weniger Streckung als am Vortag \u2192 Belastung zur\xFCck, Basis hoch. Bei zunehmender Schwellung, Streckverlust, Instabilit\xE4tsgef\xFChl, Wadenschmerz oder Fieber sofort \xE4rztlich vorstellen."},_m={A:{label:"Tag 1",title:"Zug (Oberk\xF6rper) + Grip",subtitle:"sitzend/liegend/h\xE4ngend \u2013 kein Stand-Stress f\xFCrs Knie",exercises:[{id:"ra1",number:1,name:"T\xE4gliche Basis (siehe Basis-Tab)",category:"basis",sets:"\u2014",reps:"volle Runde",rest:"\u2013",weight:"\u2013",tip:"Warm-up: Streckung + Quad Sets zuerst."},{id:"ra2",number:2,name:"Shoulder CARs + Open Book (Seitlage)",category:"mobility",sets:"2",reps:"6\u20138/Seite",rest:"\u2013",weight:"\u2013",tip:"Brustwirbels\xE4ule und Schultern mobilisieren \u2013 im Liegen, ohne Beinbeteiligung."},{id:"ra3",number:3,name:"Klimmz\xFCge / Gi-Pull-Ups",category:"accessory",sets:"4",reps:"6\u20138",rest:"90 Sek",weight:"K\xF6rpergewicht",tip:"\xDCBER EINE BOX hoch und runter \u2013 niemals abspringen oder fallen lassen. Linkes Bein locker h\xE4ngen lassen. H\xE4ngen selbst belastet das Knie nicht."},{id:"ra4",number:4,name:"Kurzhantel-Rudern, Brust gest\xFCtzt",category:"main",sets:"4",reps:"8\u201310",rest:"90 Sek",weight:"RPE 7",tip:"Auf der Schr\xE4gbank abgelegt \u2013 brustgest\xFCtzt bedeutet null Beinbeteiligung und keine Standstabilit\xE4t n\xF6tig."},{id:"ra5",number:5,name:"Ring-Rows (oder Band-Rudern sitzend)",category:"accessory",sets:"3",reps:"8\u201310",rest:"60\u201390 Sek",weight:"K\xF6rpergewicht/Band",tip:"Nur wenn du sicher stehst und die Last \xFCberwiegend rechts tr\xE4gst. Im Zweifel Band-Rudern im Sitzen \u2013 gleiche Muskulatur, null Risiko."},{id:"ra6",number:6,name:"Bizeps-Curls sitzend",category:"accessory",sets:"3",reps:"10\u201312",rest:"60 Sek",weight:"KH/Band",tip:"Sitzend ausf\xFChren."},{id:"ra7",number:7,name:"Isometric Neck Holds + Band Neck",category:"neck",sets:"3",reps:"15 Sek/Richtung",rest:"30 Sek",weight:"leicht",tip:"Kein Muskelversagen \u2013 Qualit\xE4t vor Ego."},{id:"ra8",number:8,name:"Grip: Handtuch-/Plate-Hold sitzend",category:"neck",sets:"3",reps:"30 Sek",rest:"60 Sek",weight:"schwer",tip:"Ersetzt die Farmer\u2019s Carries, solange du nicht voll belastest. Griffkraft bleibt trotzdem erhalten."}],principles:["Zug-Tag \u2013 das Dr\xFCcken liegt auf Tag 2","An die Stange und wieder runter immer \xFCber eine Box","Alles sitzend/liegend, solange Teilbelastung gilt"]},B:{label:"Tag 2",title:"Druck (Oberk\xF6rper) + Schulter",subtitle:"Bankdr\xFCcken ist ideal: liegend, keine Beinbeteiligung",exercises:[{id:"rb1",number:1,name:"T\xE4gliche Basis (siehe Basis-Tab)",category:"basis",sets:"\u2014",reps:"volle Runde",rest:"\u2013",weight:"\u2013",tip:"Warm-up."},{id:"rb2",number:2,name:"Thorakale Mobilit\xE4t",category:"mobility",sets:"2",reps:"6\u20138/Seite",rest:"\u2013",weight:"\u2013",tip:"Vor der Druckarbeit."},{id:"rb3",number:3,name:"Bench Press (LH oder KH)",category:"main",sets:"4",reps:"5\u20138",rest:"2 Min",weight:"RPE 6\u20137",tip:"OHNE Beindruck: linkes Bein bewusst locker, F\xFC\xDFe nur abgelegt (nicht abdr\xFCcken). Hier verlierst du praktisch nichts."},{id:"rb4",number:4,name:"Schulterdr\xFCcken sitzend (KH)",category:"main",sets:"4",reps:"6\u20138",rest:"90 Sek",weight:"RPE 6\u20137",tip:"HSPU/Handstand bleibt in Phase A gestrichen \u2013 wegen Aufgang und Landung, nicht wegen der Last."},{id:"rb5",number:5,name:"Liegest\xFCtze",category:"accessory",sets:"4",reps:"12\u201320",rest:"60 Sek",weight:"K\xF6rpergewicht",tip:"Nur wenn die Schiene es zul\xE4sst und die Wunde verschlossen ist. Knie bleibt gestreckt, Last \xFCber Arme und Zehen. Alternative: Floor Press."},{id:"rb6",number:6,name:"Ring-Dips oder Bank-Dips",category:"accessory",sets:"3",reps:"8\u201310",rest:"90 Sek",weight:"K\xF6rpergewicht",tip:"Ringe nur mit sicherem Ein- und Ausstieg \xFCber eine Box. Bank-Dips sind die risiko\xE4rmere Variante."},{id:"rb7",number:7,name:"Face Pulls / Band External Rotation",category:"neck",sets:"3",reps:"15",rest:"45\u201360 Sek",weight:"leicht",tip:"Schulter-Prophylaxe \u2013 nicht streichen."},{id:"rb8",number:8,name:"Trizeps sitzend (Band/KH)",category:"accessory",sets:"3",reps:"12",rest:"60 Sek",weight:"moderat",tip:"Sitzend ausf\xFChren."}],principles:["Dr\xFCck-Tag \u2013 das Ziehen liegt auf Tag 1","Bankdr\xFCcken ohne Beindruck \u2013 linkes Bein passiv","Kein Handstand/HSPU in Phase A (Aufgang und Landung)"]},C:{label:"Tag 3",title:"Rechtes Bein + H\xFCfte",subtitle:"Cross-Education: das trainierte rechte Bein h\xE4lt auch links Kraft",exercises:[{id:"rc1",number:1,name:"T\xE4gliche Basis (+ H\xFCft-Mobi)",category:"basis",sets:"\u2014",reps:"volle Runde",rest:"\u2013",weight:"\u2013",tip:"Warm-up mit zus\xE4tzlicher H\xFCftmobilit\xE4t."},{id:"rc2",number:2,name:"Einbeinige Glute Bridge RECHTS",category:"main",sets:"4",reps:"10\u201312",rest:"60 Sek",weight:"K\xF6rpergewicht",tip:"R\xFCckenlage, linkes Bein gestreckt abgelegt. Kein Valgus, Becken bleibt waagerecht."},{id:"rc3",number:3,name:"Einbeiniger Hip Thrust RECHTS",category:"main",sets:"3",reps:"8\u201310",rest:"90 Sek",weight:"moderat",tip:"Schultern auf der Bank, linkes Bein gestreckt mitf\xFChren und NICHT abst\xFCtzen. Symmetrisches Becken, kein Valgus."},{id:"rc4",number:4,name:"Band Hip Abduction/Extension RECHTS",category:"accessory",sets:"3",reps:"12\u201315",rest:"60 Sek",weight:"Miniband",tip:"Glute-med-Arbeit f\xFCr die Beinachse."},{id:"rc5",number:5,name:"Wadenheber RECHTS",category:"accessory",sets:"3",reps:"12\u201315",rest:"60 Sek",weight:"moderat",tip:"Sitzend oder im Stand mit Gehst\xFCtzen-Sicherung."},{id:"rc6",number:6,name:"Band Hip Abduction LINKS (im Liegen)",category:"accessory",sets:"3",reps:"12",rest:"60 Sek",weight:"leichtes Band",tip:"Sanft, im Liegen, kein Valgus, strikt schmerzfrei. H\xE4lt die Beinachse f\xFCr die sp\xE4tere Reha."},{id:"rc7",number:7,name:"Quad-Extra LINKS (lange Iso / Wall-Sit im freigegebenen Winkel)",category:"core",sets:"3",reps:"20\u201330 Sek",rest:"60 Sek",weight:"K\xF6rpergewicht",tip:"NUR nach Physio-Freigabe und strikt schmerzfrei, im freigegebenen Beugewinkel. Kein Kniestrecken gegen Widerstand (offene Kette) \u2013 das ist in Phase A gesperrt."},{id:"rc8",number:8,name:"Blackroll Oberk\xF6rper",category:"mobility",sets:"\u2013",reps:"nach Bedarf",rest:"\u2013",weight:"\u2013",tip:"Nicht direkt \xFCber Wunde, Kniescheibe oder Entnahmestelle rollen."}],principles:["Nur das gesunde rechte Bein wird belastet \u2013 links l\xE4uft nur passiv mit","Offene Kette links (Kniestrecken gegen Widerstand) bleibt gesperrt","Kein Valgus, Becken symmetrisch"]},D:{label:"Tag 4",title:"Rumpf + Rotation + Nacken",subtitle:"Rumpfkraft f\xFCrs Grappling \u2013 ohne Knie-Load und ohne Pivot",exercises:[{id:"rd1",number:1,name:"T\xE4gliche Basis (siehe Basis-Tab)",category:"basis",sets:"\u2014",reps:"volle Runde",rest:"\u2013",weight:"\u2013",tip:"Warm-up."},{id:"rd2",number:2,name:"Dead Bug",category:"core",sets:"3",reps:"8\u201310/Seite",rest:"45 Sek",weight:"K\xF6rpergewicht",tip:"R\xFCckenlage. Das linke Bein nur gestreckt bewegen \u2013 nicht anwinkeln."},{id:"rd3",number:3,name:"Medizinball-Rotation im SITZEN",category:"rotation",sets:"3",reps:"8\u201310/Seite",rest:"60 Sek",weight:"3\u20135 kg",tip:"Im Sitzen, damit kein Pivot \xFCber den linken Fu\xDF l\xE4uft. Rotation aus Rumpf und Schultern, Beine ruhig. Kein Wurf mit Beinantrieb."},{id:"rd4",number:4,name:"Pallof Press sitzend (Band)",category:"core",sets:"3",reps:"12/Seite",rest:"60 Sek",weight:"moderat",tip:"Anti-Rotation im Sitzen \u2013 Rumpf h\xE4lt gegen den Zug, ohne mitzudrehen."},{id:"rd5",number:5,name:"Plank",category:"core",sets:"3",reps:"30\u201345 Sek",rest:"45 Sek",weight:"K\xF6rpergewicht",tip:"Knie bleibt gestreckt, Last \xFCber Unterarme und Zehen."},{id:"rd6",number:6,name:"Side Plank RECHTS (St\xFCtzseite rechts)",category:"core",sets:"3",reps:"30 Sek",rest:"45 Sek",weight:"K\xF6rpergewicht",tip:"Links WEGLASSEN \u2013 der Adduktorenzug reizt das Innenband, das konservativ mitheilt."},{id:"rd7",number:7,name:"H\xE4ngen an der Stange + Schulterpakete",category:"accessory",sets:"3",reps:"20\u201330 Sek",rest:"60 Sek",weight:"K\xF6rpergewicht",tip:"\xDCber eine Box rauf und runter. Beine locker h\xE4ngen lassen \u2013 H\xE4ngen selbst ist f\xFCr das Knie unproblematisch."},{id:"rd8",number:8,name:"Neck Holds + Band Neck",category:"neck",sets:"3",reps:"15 Sek",rest:"30 Sek",weight:"leicht",tip:"Kein Muskelversagen."}],principles:["Rotation nur im Sitzen \u2013 kein Pivot \xFCber den linken Fu\xDF","Side Plank nur rechts (Innenband-Schutz)","Keine h\xE4ngenden Knie-Anz\xFCge, solange die Beugung limitiert ist"]}},Vm=[{phase:"A \xB7 jetzt",ab:"Woche 2",krit:"\u2014",neu:"Plan wie hier hinterlegt: Oberk\xF6rper, rechtes Bein, Rumpf + t\xE4gliche Basis"},{phase:"B",ab:"ab Woche 6",krit:"Volle Streckung 0\xB0 \xB7 Beugung \u2265 90\u2013120\xB0 \xB7 Schwellung minimal \xB7 SLR ohne Extension Lag \xB7 Gangbild ohne Hinken bei Vollbelastung",neu:"Vollbelastung, Fahrrad-Ergometer, geschlossene Kette (Beinpresse/Squat bis ~60\u201370\xB0, beidbeinig), Propriozeption"},{phase:"C",ab:"ab Monat 3",krit:"Beugung frei \xB7 keine Schwellung nach Belastung \xB7 Quadkraft links \u2265 ~70\u201380 % vom rechten Bein",neu:"Kraftaufbau steigern, einbeiniges Beintraining links, sp\xE4ter Lauf-ABC/Jogging nach Befund"},{phase:"D",ab:"ab Monat 5\u20136",krit:"Kraftsymmetrie \u2265 85 % \xB7 sauberes einbeiniges Landen \xB7 schmerz- und schwellungsfrei",neu:"Sportartspezifisch OHNE Kontakt, Plyometrie stufenweise, kontrollierte Richtungswechsel"},{phase:"E",ab:"ab Monat 9\u201312",krit:"LSI \u2265 90 % in Kraft- und Hop-Tests \xB7 \xE4rztliche Freigabe",neu:"BJJ/Judo mit Kontakt, Rollen. Wettkampf laut Schema erst ab 12 Monaten"}],Gm={A:{label:"Tag 1",title:"Zug + Grip",subtitle:"R\xFCcken/Bizeps, brustgest\xFCtzt \u2013 Knie ruhig",exercises:[{id:"pa1",number:1,name:"T\xE4gliche Basis (siehe Basis-Tab)",category:"basis",sets:"\u2014",reps:"volle Runde",rest:"\u2013",weight:"\u2013",tip:"Als Warm-up: Streckung + Quad Sets zuerst."},{id:"pa2",number:2,name:"Thorakale Mobilit\xE4t + Shoulder CARs",category:"mobility",sets:"2",reps:"6\u20138/Seite",rest:"\u2013",weight:"\u2013",tip:"Brustwirbels\xE4ule und Schultern auf die Zugarbeit vorbereiten."},{id:"pa3",number:3,name:"Rack Pull / Hip Hinge (reduzierte ROM)",category:"main",sets:"4",reps:"5",rest:"2\u20133 Min",weight:"RPE 6\u20137",tip:"Eine Variante w\xE4hlen (Rack Pull ODER Hip Hinge). Bis zur Physio-Freigabe Rack Pull aus Knieh\xF6he \u2013 kein tiefes Beugen, keine Instabilit\xE4t in Endgraden."},{id:"pa4",number:4,name:"Gi / Towel Pull-Ups",category:"accessory",sets:"4",reps:"6\u20138",rest:"90 Sek",weight:"+0\u20135 kg",tip:"Direkt nach Rack Pull \u2013 die anspruchsvollere vertika
